services:
  - type: web
    name: folio-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLIC_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TRACKER_OWNER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: REMINDERS_ENABLED
        value: "false"
      - key: VAPID_PUBLIC_KEY
        sync: false
