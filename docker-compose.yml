services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: personal_tracker_pg
    environment:
      POSTGRES_DB: personal_tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d personal_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
