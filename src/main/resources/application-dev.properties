# Explicit local development only. Cloud uses its own required credentials.
server.address=127.0.0.1
tracker.auth.enabled=false
spring.datasource.url=jdbc:h2:file:./data/tracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
tracker.vector-store.mode=embedded
