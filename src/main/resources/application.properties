spring.application.name=study-rag
spring.threads.virtual.enabled=true

# Default H2 In-Memory DataSource (PostgreSQL mode for seamless fallback)
spring.datasource.url=jdbc:h2:mem:personal_tracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Vector Store configuration
tracker.vector-store.mode=auto
spring.datasource.host=localhost
spring.datasource.port=5432

# Ollama & Local Model configuration (RTX 4060 GPU optimized)
ollama.base-url=http://localhost:11434
ollama.chat-model=llama3.1:8b
ollama.embed-model=nomic-embed-text
ollama.num-ctx=8192

# Tracker Storage & Timezone
tracker.storage.path=${user.home}/tracker
tracker.timezone=UTC
