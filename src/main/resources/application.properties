spring.application.name=study-rag
spring.profiles.default=dev
spring.threads.virtual.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
ai.provider=gemini
gemini.api-key=${GEMINI_API_KEY:}
gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
ai.personal-enabled=false
ai.capture-enabled=true
ai.max-daily-requests=100
ai.max-minute-requests=20
tracker.timezone=Asia/Kolkata
tracker.vector-store.mode=auto
tracker.auth.enabled=true
tracker.auth.owner-id=${TRACKER_OWNER_ID:}
tracker.cors.origins=${FRONTEND_URL:http://localhost:5173}
supabase.url=${SUPABASE_URL:}
supabase.public-key=${SUPABASE_PUBLIC_KEY:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.storage.bucket=documents
reminders.enabled=${REMINDERS_ENABLED:false}
reminders.vapid-public-key=${VAPID_PUBLIC_KEY:}
