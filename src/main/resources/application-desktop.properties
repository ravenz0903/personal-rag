# Desktop launcher binds a private loopback API and supplies a new token each run.
server.address=127.0.0.1
server.port=0
tracker.auth.enabled=false
tracker.desktop.token=${FOLIO_DESKTOP_TOKEN:}
spring.datasource.url=jdbc:h2:file:${FOLIO_DATA_DIR:./data}/tracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
tracker.vector-store.mode=embedded
ai.enabled=false
ai.capture-enabled=false
documents.indexing-enabled=false
reminders.enabled=false
server.error.include-message=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
spring.datasource.hikari.maximum-pool-size=3
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/desktop
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
